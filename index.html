.alert { display: flex; gap: 12px; align-items: flex-start; text-align: start; padding: 12px 14px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; background: var(--surface); text-decoration: none; color: inherit; }

.alert strong { font-size: 13.5px; }

.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }

.grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

input[type=search], input[type=text], input[type=date], input[type=month], input[type=number], input[type=email], input[type=tel], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=search] { min-width: 220px; }
textarea { width: 100%; min-height: 60px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }

tfoot td { font-weight: 600; background: color-mix(in srgb, var(--bg) 60%, var(--surface)); }

td .stack { display: flex; flex-direction: column; gap: 2px; }
td .sub { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }

.pill { display: inline-block; border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a .count { background: var(--warn-soft); color: var(--warn); border-radius: 99px; font-size: 11px; padding: 0 6px; font-weight: 700; }

.chart-row { display: grid; grid-template-columns: 150px 1fr 110px; gap: 10px; align-items: center; padding: 3px 0; }
.chart-row .lbl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chart-row .v { font-size: 12.5px; text-align: end; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.trend { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.trend .col { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%; }
.trend .col i { width: 40%; max-width: 22px; border-radius: 4px 4px 0 0; }
.trend-labels { display: flex; gap: 10px; }
.trend-labels span { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.note { background: var(--warn-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.note.info { background: var(--info-soft); }

.client-head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.client-head .bal { margin-inline-start: auto; text-align: end; }
.client-head .bal b { font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.client-head .bal small { color: var(--muted); }

.modal-bg { position: fixed; inset: 0; background: rgba(10, 10, 10, .45); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: min(760px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(1080px, 100%); }
.modal > header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal > header h2 { font-size: 17px; flex: 1; }
.modal > .body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal > footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.form h3 { grid-column: 1 / -1; font-size: 13.5px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field.full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 13px; }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.checks input { accent-color: var(--accent); }
.doc-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; gap: 8px; align-items: center; }
.err { color: var(--crit); font-size: 13px; }
.toast { position: fixed; bottom: 20px; inset-inline-end: 20px; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 420px; }
.toast.bad { background: var(--crit); color: #fff; }
.loading { padding: 60px; text-align: center; color: var(--muted); }
.hero-empty { padding: 40px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.hero-empty h2 { font-size: 20px; }
.hero-empty p { color: var(--muted); max-width: 560px; margin: 0; }
.ro-banner { background: var(--info-soft); color: var(--info); padding: 8px 28px; font-size: 13px; }
.picker { border: 1px solid var(--line); border-radius: 8px; max-height: 340px; overflow-y: auto; }
.picker label { display: grid; grid-template-columns: 20px 1fr auto auto; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.picker label:hover { background: var(--accent-soft); }
.picker small { color: var(--muted); }

/* PDF layout: fixed light palette, independent of the viewer's theme */
.pdf-doc { box-sizing: border-box; overflow: hidden; background: #fff; color: #16202E; font: 12px/1.6 Arial, "Liberation Sans", "IBM Plex Sans Arabic", sans-serif; padding: 4px 2px; direction: rtl; }

.pdf-doc .brand { font-size: 21px; font-weight: 700; color: #13294B; line-height: 1.35; }

.pdf-doc .ph-rule i { flex: 1; height: 1px; background: #A6824A; display: block; } .pdf-doc .ph-rule b { width: 7px; height: 7px; border-radius: 50%; background: #A6824A; display: block; }

.pdf-doc tr:nth-child(even) td { background: #FBF9F4; }
.pdf-doc td.n, .pdf-doc th.n { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Income certificate: one A4 page laid out like the office's existing certificate (sizes measured from it) */
.cert-page { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #fff; color: #000; direction: rtl; font-family: Arial, "IBM Plex Sans Arabic", sans-serif; font-weight: 700; }
.cert-shape { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--cg, #00be62); }
.cert-logo { position: absolute; top: 14mm; left: 1.5mm; width: 66mm; height: auto; }
.cert-title { position: absolute; top: 55mm; left: 0; right: 0; text-align: center; font-size: 17pt; font-weight: 700; text-decoration: underline; text-underline-offset: 2.2mm; margin: 0; }
.cert-text { position: absolute; top: 83.8mm; right: 19.5mm; left: 35mm; font-size: 12.5pt; line-height: 11.2mm; }
.cert-text p { margin: 0; }
.cert-text .cn { font-family: Arial, "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 13.5pt; }
.cert-close { text-align: center; margin-top: 4mm !important; }

.cert-foot div { display: flex; align-items: center; gap: 12mm; }

.cert-foot svg { width: 2.8mm; height: 2.8mm; fill: none; stroke: #666; stroke-width: 1.8; }
.cert-preview { overflow: auto; display: flex; justify-content: center; background: var(--bg); padding: 12px; border-radius: 8px; }
.cert-scale { zoom: .62; box-shadow: 0 4px 20px rgba(0,0,0,.15); }


/* Modern certificate */
.cert-page.cm { font-family: "IBM Plex Sans Arabic", Arial, sans-serif; font-weight: 400; color: #1a1a1a; padding: 14mm 18mm 0; font-size: 11.5pt; line-height: 1.75; }

.cm-title { text-align: center; margin: 6mm 0 5mm; }

.cm-title small { display: block; font-family: Roboto, Arial, sans-serif; font-size: 8.5pt; letter-spacing: 4px; color: #8a8a8a; margin-top: 1mm; }

.cm-greet { color: #444; }

/* Classic certificate: double frame, corner ornaments, Ruqaa title, Naskh text */
.cert-page.cc { font-family: CertSerif, "Times New Roman", serif; font-weight: 400; color: #1a1a1a; font-size: 15pt; }
.cc .cn { font-family: CertSerif, "Times New Roman", serif; font-weight: 700; }
.cc-frame { position: absolute; inset: 9mm; border: .9mm solid #1c1c1c; }
.cc-frame::after { content: ""; position: absolute; inset: 1.6mm; border: .3mm solid #1c1c1c; }
.cc-corner { position: absolute; width: 13mm; height: 13mm; display: block; }
.cc-corner svg { width: 100%; height: 100%; fill: none; stroke: var(--cg); stroke-width: 1.6; }

.cc-mark { position: absolute; width: 115mm; height: 115mm; left: 47.5mm; top: 100mm; opacity: .04; }

.cc-text { position: absolute; top: 80mm; right: 25mm; left: 25mm; line-height: 2.05; }

.cc-close { text-align: center; margin-top: 3mm !important; }
.cc-sign { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 4mm; }

/* Sidebar modes: pinned (in the grid) or floating (hidden; opens over the page) */
.app.floating { grid-template-columns: 1fr; }
.app.floating .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: 250px; z-index: 40; transform: translateX(100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25); }
.app.floating .btn.menu-btn { display: inline-flex; }
.app.floating .side.open { transform: none; }
.app.floating .side:not(.open) { box-shadow: none; visibility: hidden; transition: transform .2s, visibility 0s .2s; }
.app.floating .side.open { visibility: visible; transition: transform .2s; }
.side-edge { display: none; position: fixed; inset-block: 0; inset-inline-start: 0; width: 6px; z-index: 38; }
@media (hover: hover) { .app.floating .side-edge { display: block; } }
.side-scrim { display: none; position: fixed; inset: 0; background: rgba(10,10,10,.35); z-index: 39; }
.side.open + .side-scrim { display: block; }
@media (max-width: 900px) {
  .pin-btn { display: none !important; }
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: 250px; z-index: 40; transform: translateX(100%); transition: transform .2s; }
  .side.open { transform: none !important; }
  .btn.menu-btn { display: inline-flex; }
  .grid2, .grid2e { grid-template-columns: 1fr; }
  .content, .top { padding-inline: 16px; }
  .chart-row { grid-template-columns: 100px 1fr 90px; }
  .doc-row { grid-template-columns: 1fr 1fr; }
}

/* ---------- MG shell: navy bar with a gold rule, four sections, tools; the section's pages as tabs underneath ---------- */

/* page motion: short, and none when the system asks for less */

#main.page-enter .content > * { animation: rise .2s ease-out both; }

/* ---------- quick search ---------- */
