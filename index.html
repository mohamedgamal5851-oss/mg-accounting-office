<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة مكتب المحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout: fixed brand sidebar + scrolling work area; summary tiles, then alerts, then detail. */
:root {
  --brand: #1c1c1c;        /* MG charcoal: sidebar */
  --accent: #3d3d3d;       /* MG graphite: actions, active states */
  --accent-soft: #ececeb;
  --gold: #7a7a7a;
  --bg: #f5f5f4;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --line: #e3e3e1;
  --warn: #b25e00; --warn-soft: #fff3e0;
  --crit: #b3261e; --crit-soft: #fdecea;
  --ok: #1d7a46; --ok-soft: #e6f4ec;
  --info: #2f5fa8; --info-soft: #e8effa;
  --font-body: "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #0d0d0d; --accent: #c9c9c9; --accent-soft: #2a2a2a; --bg: #121212; --surface: #1b1b1b; --ink: #ececec; --muted: #9a9a9a; --line: #2e2e2e;
    --warn: #f0a54a; --warn-soft: #3a2a12; --crit: #f28b82; --crit-soft: #3c1d1a; --ok: #6fd39a; --ok-soft: #15301f; --info: #8fb4ee; --info-soft: #18253a; --gold: #9a9a9a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, td.n, .tile b { font-variant-numeric: tabular-nums; }
td.n { white-space: nowrap; text-align: end; }
.code { font-family: var(--font-mono); font-size: 12.5px; }
.neg { color: var(--ok); }
.pos { color: var(--crit); }

.app { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
.side { background: var(--brand); color: #d6d6d6; display: flex; flex-direction: column; padding: 20px 14px; gap: 18px; overflow-y: auto; }
.logo { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.logo strong { font-size: 16px; color: #fff; line-height: 1.4; letter-spacing: .3px; }
.logo span { font-size: 12px; opacity: .75; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: inherit; text-decoration: none; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.07); }
.nav a.on { background: rgba(255,255,255,.13); color: #fff; }
.nav a .badge { margin-inline-start: auto; background: #e9a23b; color: #2a1800; border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.nav svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav a.apps { opacity: .85; font-size: 13px; }
.nav a.soon { opacity: .45; cursor: default; }
.nav-mod { font-size: 11.5px; letter-spacing: .3px; opacity: .6; padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,.1); margin-top: 6px; }
.mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.mods .mod { min-height: 190px; padding: 26px 28px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.mod:hover { border-color: var(--accent); transform: translateY(-2px); }
.mod-ic { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.mod-ic svg { width: 26px; height: 26px; }
.mod b { font-size: 17px; }
.mod small { color: var(--muted); font-size: 13px; line-height: 1.7; }
.mod-stat { margin-top: 6px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.vat-tbl td, .vat-tbl th { white-space: nowrap; }
.vat-tbl td.wrap { white-space: normal; min-width: 160px; }
.vat-tbl select { padding: 3px 6px; font-size: 12.5px; }
.vat-tbl tr.x td:not(:last-child) { opacity: .5; }
.vat-tbl tr.x td:last-child .btn[data-act=vat-toggle-x] { border-color: var(--accent); font-weight: 600; }
.vat-form10 th, .vat-form10 td { text-align: center; }
.vat-form10 th:first-child, .vat-form10 td:first-child { text-align: start; }
.iss { display: inline-block; font-size: 11.5px; border-radius: 6px; padding: 0 6px; margin: 1px 0 1px 4px; }
.iss.crit { background: var(--crit-soft); color: var(--crit); } .iss.warn { background: var(--warn-soft); color: var(--warn); } .iss.info { background: var(--info-soft); color: var(--info); }
.lines-ed { width: 100%; border-collapse: collapse; font-size: 13px; }
.lines-ed td, .lines-ed th { padding: 4px; border-bottom: 1px solid var(--line); }
.lines-ed input, .lines-ed select { width: 100%; min-width: 60px; }
.lines-ed td.d input { min-width: 180px; }
.match-ok { color: var(--ok); font-weight: 700; } .match-bad { color: var(--crit); font-weight: 700; }
.savestate { font-size: 12px; color: var(--muted); }
.bulk { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.dl-strip { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end; }
.dl-strip > div { display: flex; flex-direction: column; gap: 2px; }
.dl-strip small { color: var(--muted); font-size: 12px; } .dl-strip b { font-size: 24px; line-height: 1.2; } .dl-strip span { color: var(--muted); font-size: 12px; }
.dl-strip .dl-bar { flex: 1 1 200px; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; align-self: center; }
.dl-strip .dl-bar i { display: block; height: 100%; background: var(--ok); }
.dl-left { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 14px; } .dl-left a { text-decoration: none; }
.heat { border-collapse: collapse; } .heat th, .heat td { text-align: center; padding: 6px 4px; border: 1px solid var(--line); font-size: 12px; min-width: 52px; }
.heat td:first-child, .heat th:first-child { text-align: start; min-width: 180px; padding-inline: 10px; }
.heat td a { color: inherit; text-decoration: none; display: block; font-variant-numeric: tabular-nums; }
.hm-matched { background: var(--ok-soft); color: var(--ok); } .hm-diff { background: var(--crit-soft); color: var(--crit); font-weight: 700; }
.hm-submitted { background: var(--accent-soft); } .hm-ready { background: var(--info-soft); color: var(--info); } .hm-draft { background: var(--warn-soft); color: var(--warn); }
.hm-late { background: repeating-linear-gradient(45deg, var(--crit-soft), var(--crit-soft) 4px, transparent 4px, transparent 8px); color: var(--crit); font-weight: 700; }
.hm-na { background: var(--bg); }
.vlegend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); } .vlegend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
.vchart { width: 100%; height: auto; } .vchart .ax { stroke: var(--line); } .vchart .gl { stroke: var(--line); stroke-dasharray: 2 4; } .vchart .tk { fill: var(--muted); font-size: 11px; }
.hbar { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 120px; gap: 10px; align-items: center; margin: 6px 0; font-size: 13px; }
.hbar div { background: var(--line); height: 12px; border-radius: 99px; overflow: hidden; } .hbar i { display: block; height: 100%; background: var(--crit); }
.hbar b { text-align: end; font-variant-numeric: tabular-nums; }
.to-mods { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 2px 8px 2px 4px; margin-inline-start: -8px; transition: background .2s, color .2s; }
.to-mods:hover, .to-mods:focus-visible { background: var(--accent-soft); color: var(--accent); }
.to-mods-ic { display: inline-grid; place-items: center; width: 0; overflow: hidden; opacity: 0; transition: width .2s, opacity .2s; }
.to-mods-ic svg { width: 18px; height: 18px; }
.to-mods:hover .to-mods-ic, .to-mods:focus-visible .to-mods-ic { width: 20px; opacity: 1; }
#main.page-leave { animation: pageLeave .23s cubic-bezier(.4,0,1,1) forwards; }
#main.page-enter { animation: pageEnter .38s cubic-bezier(.16,1,.3,1); }
@keyframes pageLeave { to { opacity: 0; transform: scale(.97) translateY(6px); filter: blur(2px); } }
@keyframes pageEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.mods .mod { animation: modIn .55s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i, 0) * 90ms + 60ms); }
@keyframes modIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
.mod.mod-picked { animation: modPick .32s cubic-bezier(.4,0,.2,1) forwards; z-index: 2; }
@keyframes modPick { to { transform: scale(1.06); box-shadow: 0 18px 50px rgba(0,0,0,.18); border-color: var(--accent); } }
@media (prefers-reduced-motion: reduce) { #main.page-leave, #main.page-enter, .mods .mod, .mod.mod-picked { animation: none !important; } }
.modal.pdfv { max-width: 980px; width: 96vw; }
.sp-pages { display: flex; flex-direction: column; gap: 12px; max-height: 72vh; overflow: auto; background: var(--bg); padding: 10px; border-radius: 10px; }
.sp-pages canvas { background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); border-radius: 4px; }
.bulk select { padding: 4px 8px; font-size: 12.5px; }
.side .foot { margin-top: auto; font-size: 12px; opacity: .8; padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.side .foot button { background: rgba(255,255,255,.1); border: 0; border-radius: 6px; padding: 6px 10px; color: #fff; cursor: pointer; align-self: flex-start; }

.main { overflow-y: auto; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px max(28px, calc((100% - 1680px) / 2 + 28px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 20px; font-weight: 600; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .grow { flex: 1; }
/* the work area fills the screen up to a comfortable reading width, centred on very wide screens; the top bar lines up with it */
.content { padding: 22px 28px 60px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1680px; margin-inline: auto; box-sizing: border-box; }
.btn.menu-btn { display: none; }
a { color: var(--accent); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card > header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.card > header h2 { font-size: 15px; font-weight: 600; }
.card > header .hint { color: var(--muted); font-size: 12.5px; }
.card > header .grow { flex: 1; }
.card > .body { padding: 16px 18px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border-inline-start: 4px solid var(--line); text-align: start; cursor: pointer; text-decoration: none; color: inherit; }
.tile span { color: var(--muted); font-size: 12.5px; }
.tile b { font-size: 24px; font-weight: 600; line-height: 1.2; }
.tile small { color: var(--muted); font-size: 12px; }
.tile.c1 { border-inline-start-color: var(--brand); }
.tile.c2 { border-inline-start-color: var(--crit); }
.tile.c3 { border-inline-start-color: var(--ok); }
.tile.c4 { border-inline-start-color: var(--accent); }
.tile.c5 { border-inline-start-color: var(--warn); }

.alerts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.alert { display: flex; gap: 12px; align-items: flex-start; text-align: start; padding: 12px 14px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; background: var(--surface); text-decoration: none; color: inherit; }
.alert b { font-size: 22px; line-height: 1; min-width: 30px; }
.alert div { display: flex; flex-direction: column; gap: 2px; }
.alert strong { font-size: 13.5px; }
.alert small { color: var(--muted); font-size: 12px; }
.alert.crit { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 30%, transparent); }
.alert.crit b { color: var(--crit); }
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.alert.warn b { color: var(--warn); }
.alert.info { background: var(--info-soft); }
.alert.info b { color: var(--info); }
.alert.ok { background: var(--ok-soft); }
.alert.ok b { color: var(--ok); }

.grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
.grid2e { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
.toolbar label.inl { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
input[type=search], input[type=text], input[type=date], input[type=month], input[type=number], input[type=email], input[type=tel], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=search] { min-width: 220px; }
textarea { width: 100%; min-height: 60px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: color-mix(in srgb, var(--bg) 60%, var(--surface)); position: sticky; top: 0; white-space: nowrap; }
th.n { text-align: end; }
tfoot td { font-weight: 600; background: color-mix(in srgb, var(--bg) 60%, var(--surface)); }
tr.row-crit td { background: var(--crit-soft); }
tr.row-warn td { background: var(--warn-soft); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
td .stack { display: flex; flex-direction: column; gap: 2px; }
td .sub { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }

.pill { display: inline-block; border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.mute { background: var(--line); color: var(--muted); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a .count { background: var(--warn-soft); color: var(--warn); border-radius: 99px; font-size: 11px; padding: 0 6px; font-weight: 700; }

.chart-row { display: grid; grid-template-columns: 150px 1fr 110px; gap: 10px; align-items: center; padding: 3px 0; }
.chart-row .lbl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart-row .bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--bg); }
.chart-row .bar i { display: block; height: 100%; }
.chart-row .v { font-size: 12.5px; text-align: end; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.trend { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.trend .col { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%; }
.trend .col i { width: 40%; max-width: 22px; border-radius: 4px 4px 0 0; }
.trend-labels { display: flex; gap: 10px; }
.trend-labels span { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.note { background: var(--warn-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.note.info { background: var(--info-soft); }

.client-head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.client-head .bal { margin-inline-start: auto; text-align: end; }
.client-head .bal b { font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.client-head .bal small { color: var(--muted); }

.modal-bg { position: fixed; inset: 0; background: rgba(10, 10, 10, .45); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: min(760px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(1080px, 100%); }
.modal > header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal > header h2 { font-size: 17px; flex: 1; }
.modal > .body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal > footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.form h3 { grid-column: 1 / -1; font-size: 13.5px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field.full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 13px; }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.checks input { accent-color: var(--accent); }
.doc-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; gap: 8px; align-items: center; }
.err { color: var(--crit); font-size: 13px; }
.toast { position: fixed; bottom: 20px; inset-inline-end: 20px; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 420px; }
.toast.bad { background: var(--crit); color: #fff; }
.loading { padding: 60px; text-align: center; color: var(--muted); }
.hero-empty { padding: 40px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.hero-empty h2 { font-size: 20px; }
.hero-empty p { color: var(--muted); max-width: 560px; margin: 0; }
.ro-banner { background: var(--info-soft); color: var(--info); padding: 8px 28px; font-size: 13px; }
.picker { border: 1px solid var(--line); border-radius: 8px; max-height: 340px; overflow-y: auto; }
.picker label { display: grid; grid-template-columns: 20px 1fr auto auto; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.picker label:hover { background: var(--accent-soft); }
.picker small { color: var(--muted); }

/* PDF layout: fixed light palette, independent of the viewer's theme */
.pdf-doc { box-sizing: border-box; overflow: hidden; background: #fff; color: #1a1a1a; font: 12px/1.55 "IBM Plex Sans Arabic", sans-serif; padding: 4px 2px; direction: rtl; }
.pdf-doc .pdf-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 3px solid #1c1c1c; padding-bottom: 10px; margin-bottom: 14px; }
.pdf-doc .brand-wrap { display: flex; gap: 12px; align-items: center; }
.pdf-doc .brand-logo { height: 62px; width: auto; }
.pdf-doc .brand { font-size: 18px; font-weight: 700; color: #1c1c1c; }
